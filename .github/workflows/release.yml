name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: omniplayer/package-lock.json

      - name: Build setup.exe and portable zip
        shell: pwsh
        run: ./omniplayer/package.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnitrace-windows-x64
          path: |
            dist/OmniTrace-*-windows-x64-setup.exe
            dist/OmniTrace-*-windows-x64.zip
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OmniTrace-*-windows-x64-setup.exe
            dist/OmniTrace-*-windows-x64.zip
          generate_release_notes: true
          body: |
            **给朋友：** 下载 **`OmniTrace-…-windows-x64-setup.exe`**，下一步下一步即可（当前用户，一般不用管理员）。里面是播放器 + 采集器。

            数据在本机 `%USERPROFILE%\OmniTrace\OmniDatabase`，不进安装包。卸载（设置 → 应用 → OmniTrace）不删库。

            Windows 提示「未知应用」：选 **更多信息 → 仍要运行**（目前没有代码签名）。

            也可以下 zip，解压后双击「安装到本机.bat」。

            **For friends:** download **`OmniTrace-…-windows-x64-setup.exe`**, Next Next Next (per-user, usually no UAC). Player + recorder included.

            Data stays in `%USERPROFILE%\OmniTrace\OmniDatabase` and is not in the package. Uninstall keeps the library.

            SmartScreen: **More info → Run anyway** (unsigned). Zip is still attached.
