[package]
name = "omniplayer"
version = "0.1.3"
description = "OmniPlayer - replay Liuhen (留痕) recordings"
authors = ["Fortda"]
edition = "2021"

[lib]
name = "omniplayer_lib"
# staticlib 仅 iOS；桌面编三遍会拖慢每次 tauri dev。
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 正式包走 frontendDist（嵌入 UI）。裸 `cargo build --release` 若不带此 feature，
# 会编成 cfg(dev)，启动去连 Vite `127.0.0.1:1420` → 双击稳定版出现 Edge 拒绝连接。
# `tauri dev` 会关 custom-protocol，仍用 devUrl。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Foundation"
] }
webview2-com = "0.38"

[profile.dev]
incremental = true
# 全量 debug=2 在 Windows 上链接经常 1 分钟+；行号够 panic 回溯。
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

